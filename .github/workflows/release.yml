name: release

# Builds hmx binaries for Linux (x86_64), macOS (arm64) and Windows
# (x86_64, MinGW) and attaches them — plus a .deb — to the GitHub
# Release for the pushed tag (v0.9.0, v0.10.0, …).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake flex bison

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake flex bison
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Install deps (Windows / MSYS2 MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-flex
            mingw-w64-x86_64-bison

      - name: Configure & build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test (native suites + CLI)
        shell: bash
        run: |
          ./tests/run_integration.sh >/dev/null
          ./tests/run_negative_tests.sh >/dev/null
          ./tests/run_stress_tests.sh >/dev/null
          ./tests/run_cli_tests.sh >/dev/null

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build && cpack -G DEB
          mv "hmx-${GITHUB_REF_NAME#v}-Linux.deb" "hmx_${GITHUB_REF_NAME#v}_amd64.deb"

      - name: Package tarball (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf stage && cmake --install build --prefix "$PWD/stage"
          tar -C stage -czf "hmx-${GITHUB_REF_NAME#v}-${{ matrix.label }}.tar.gz" bin/hmx

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          if ($ver -like 'v*') { $ver = $ver.Substring(1) }
          cmake --install build --prefix "$PWD/stage"
          Compress-Archive -Path stage/bin/hmx.exe -DestinationPath "hmx-$ver-${{ matrix.label }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmx-${{ matrix.label }}
          path: |
            hmx*.tar.gz
            hmx*.zip
            hmx*.deb

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**