name: release

# Builds hmx binaries for Linux (x86_64), macOS (arm64) and Windows
# (x86_64, MinGW) and attaches them — plus a .deb — to the GitHub
# Release for the pushed tag (v0.9.0, v0.10.0, …).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)cut a release for, e.g. v0.10.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Fail fast instead of burning the 6-hour default: the macOS job of
    # v0.9.0 sat for six hours and was killed by the platform timeout,
    # which said nothing about what actually went wrong.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    env:
      # Homebrew can block for hours on a runner: a background
      # `brew update` holds the global lock, and any interactive prompt
      # waits forever without a TTY. Both are what turned the v0.9.0
      # macOS job into a six-hour stall.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NONINTERACTIVE: "1"
      # github.ref_name is the *branch* on a workflow_dispatch run, so the
      # packaging steps read the tag from here instead of GITHUB_REF_NAME.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake flex bison ninja-build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # `|| true` on cleanup: a failed autoremove must not fail the job
          # after the toolchain is already in place.
          brew cleanup || true
          brew install cmake flex bison ninja
          # flex, bison and ninja are keg-only on macOS: their binaries are
          # not linked into /opt/homebrew/bin, so every one of them needs
          # its prefix on PATH explicitly (v0.9.0 only did flex and bison,
          # which is why the build step could not see cmake/ninja).
          for f in flex bison ninja cmake; do
            p="$(brew --prefix "$f")/bin"
            [ -d "$p" ] && echo "$p" >> "$GITHUB_PATH"
          done
          echo "--- versions ---"
          for t in cmake flex bison ninja; do command -v "$t" >/dev/null || { echo "$t NOT on PATH"; exit 1; }; done

      - name: Install deps (Windows / MSYS2 MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            flex
            bison
            ninja

      - name: Configure & build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Ninja ships as a dependency of the cmake package; the macOS
          # runner gets keg-only flex/bison on PATH via GITHUB_PATH above.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Force the MinGW toolchain: windows-latest defaults to the MSVC
          # generator, but flex-generated lexer.cpp uses strdup()/POSIX bits
          # (fine under MinGW, not MSVC). Must run under the msys2 shell —
          # Git Bash cannot see the MSYS2 install. ninja here is the
          # msys-native package (there is no mingw-w64-x86_64-ninja).
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build

      # One step per suite, output not discarded. The previous version ran all
      # four in a single step with `> /dev/null`; a macOS job then sat in the
      # integration suite until the job timeout and the log could not say which
      # case it was on, so the cause was unknowable from the run.
      - name: Integration suite
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run_integration.sh

      - name: Negative suite
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run_negative_tests.sh

      - name: Stress & output suite
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run_stress_tests.sh

      - name: CLI suite
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run_cli_tests.sh

      - name: Integration suite (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./tests/run_integration.sh

      - name: Negative suite (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./tests/run_negative_tests.sh

      - name: Stress & output suite (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./tests/run_stress_tests.sh

      - name: CLI suite (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./tests/run_cli_tests.sh

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ver="${RELEASE_TAG#v}"
          # cpack writes into build/, but the upload pattern below is relative
          # to the workspace root — so the .deb stayed in build/ and matched
          # nothing, and the release shipped without it. Move it up next to the
          # tarball, then assert it is there: an artifact glob that matches
          # nothing is not an error, so this release failed quietly.
          (cd build && cpack -G DEB)
          mv "build/hmx-${ver}-Linux.deb" "hmx_${ver}_amd64.deb"
          test -f "hmx_${ver}_amd64.deb" || { echo "::error::.deb not produced"; exit 1; }
          ls -l "hmx_${ver}_amd64.deb"

      - name: Package tarball (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ver="${RELEASE_TAG#v}"
          rm -rf stage && cmake --install build --prefix "$PWD/stage"
          tar -C stage -czf "hmx-${ver}-${{ matrix.label }}.tar.gz" bin/hmx

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ver="${RELEASE_TAG#v}"
          cmake --install build --prefix "$(pwd -W)/stage"
          # pwd -W gives wind32-style forward-slash paths, which both cmake
          # and PowerShell accept; run under msys2 so cmake is on PATH.
          powershell.exe -NoProfile -Command "& { Compress-Archive -Path '$(pwd -W)/stage/bin/hmx.exe' -DestinationPath 'hmx-$ver-${{ matrix.label }}.zip' }"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hmx-${{ matrix.label }}
          # `error`, not the default `warn`: with several patterns, one of them
          # matching nothing is not reported, so a platform can quietly
          # contribute no archive and the release still goes green. This only
          # fires when *every* pattern is empty, which no platform should be.
          if-no-files-found: error
          path: |
            hmx*.tar.gz
            hmx*.zip
            hmx*.deb

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS ships next to the artifacts so install.sh can verify what
      # it downloads instead of trusting the connection. Generated here, after
      # the merge, so it covers every platform in one file. `find` rather
      # than globs: an unmatched glob is passed through literally and would
      # fail the step under `set -e -o pipefail`.
      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) \
            -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          test -s SHA256SUMS

      # The release is the contract every installer, tap and package manager
      # resolves against, so name the assets that must exist rather than
      # trusting that they were produced. This is the step that would have
      # caught the missing .deb: it was never uploaded, and every consumer of it
      # — install.sh on Debian/Ubuntu, the README's .deb row — 404s silently.
      - name: Assert every expected asset is present
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ver="${RELEASE_TAG#v}"
          missing=0
          for want in \
            "hmx_${ver}_amd64.deb" \
            "hmx-${ver}-linux-x86_64.tar.gz" \
            "hmx-${ver}-macos-arm64.tar.gz" \
            "hmx-${ver}-windows-x86_64.zip" \
            SHA256SUMS
          do
            if [ -f "dist/$want" ]; then
              echo "present: $want"
            else
              echo "::error::missing release asset: $want"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # Nothing unexpected either: a stray archive means a naming change
          # that the installers have not been told about.
          extra="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort \
                   | grep -vxF -e "hmx_${ver}_amd64.deb" \
                                -e "hmx-${ver}-linux-x86_64.tar.gz" \
                                -e "hmx-${ver}-macos-arm64.tar.gz" \
                                -e "hmx-${ver}-windows-x86_64.zip" \
                                -e SHA256SUMS || true)"
          if [ -n "$extra" ]; then
            echo "::error::unexpected files in the release:"; echo "$extra"; exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/**