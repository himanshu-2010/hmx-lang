name: ci

# Continuous integration on every push and pull request. Three jobs:
#   1. build-test   — native compiler + all four suite runners (O2).
#   2. asan         — every integration/stress fixture built with
#                     AddressSanitizer + LeakSanitizer (HMX_ASAN=1 hook in
#                     main.cpp). Catches refcount errors, use-after-free and
#                     leaks in the M15 reference-counted runtime.
#   3. valgrind     — valgrind directly on each generated binary (never on the
#                     compiler) via tests/run_valgrind_tests.sh; rejects any
#                     definite/indirect/possible leak or memory error.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + native suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake flex bison ninja-build

      - name: Configure & build
        run: cmake -S . -B build -G Ninja && cmake --build build

      - name: Integration suite
        run: ./tests/run_integration.sh

      - name: Stress & output suite
        run: ./tests/run_stress_tests.sh

      - name: Negative tests
        run: ./tests/run_negative_tests.sh

      - name: CLI tests
        run: ./tests/run_cli_tests.sh

  asan:
    name: ASan + LeakSanitizer
    runs-on: ubuntu-latest
    env:
      HMX_ASAN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake flex bison ninja-build

      - name: Configure & build
        run: cmake -S . -B build -G Ninja && cmake --build build

      - name: Integration suite (ASan)
        run: ./tests/run_integration.sh

      - name: Stress & output suite (ASan)
        run: ./tests/run_stress_tests.sh

  valgrind:
    name: valgrind ownership matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake flex bison ninja-build valgrind

      - name: Configure & build
        run: cmake -S . -B build -G Ninja && cmake --build build

      - name: Valgrind ownership checks
        run: ./tests/run_valgrind_tests.sh --fixtures

  portability-macos:
    # The Windows and macOS builds used to be exercised only by release.yml,
    # so a <sys/wait.h> that does not exist under MinGW-w64 sat unnoticed
    # until a release attempt died on it. Every push now compiles the compiler
    # and runs the CLI suite (which pins exit-code propagation) on both.
    # Windows is a separate job because msys2 has to be the step shell, which
    # `defaults.run.shell` cannot vary per matrix entry.
    name: portability (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # A background `brew update` holding the global lock, or an
      # interactive prompt on a TTY-less runner, is what turned the v0.9.0
      # macOS release job into a six-hour stall.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      NONINTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (macOS)
        run: |
          brew install cmake flex bison ninja
          for f in flex bison ninja cmake; do
            p="$(brew --prefix "$f")/bin"
            [ -d "$p" ] && echo "$p" >> "$GITHUB_PATH"
          done

      - name: Configure & build
        run: |
          if command -v ninja >/dev/null; then
            cmake -S . -B build -G Ninja && cmake --build build
          else
            cmake -S . -B build && cmake --build build --config Release
          fi

      - name: CLI suite
        run: ./tests/run_cli_tests.sh

      - name: Integration suite
        run: ./tests/run_integration.sh

  portability-windows:
    # The Windows half of the portability gate. Kept separate from the macOS
    # job because msys2 has to be the step shell, which `defaults.run.shell`
    # cannot vary per matrix entry.
    name: portability (windows, MinGW)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (MSYS2 MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            flex
            bison
          update: true

      - name: Configure & build
        run: |
          cmake -S . -B build -G Ninja && cmake --build build

      - name: CLI suite
        run: ./tests/run_cli_tests.sh

      - name: Integration suite
        run: ./tests/run_integration.sh

  packaging:
    name: packaging manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest consistency gate
        run: ./tests/run_packaging_tests.sh