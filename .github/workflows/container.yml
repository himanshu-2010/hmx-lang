name: container

# Builds the hmx image and publishes it to GHCR.
#
#   docker run --rm -v "$PWD:/src" ghcr.io/himanshu-2010/hmx run main.hmx
#
# Tagged with the release version so `ghcr.io/himanshu-2010/hmx:0.10.0` is
# reproducible, and with `latest` off main.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    name: build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Log in even on a pull request: a fork's PR gets its own read-only
      # token, and the push step below is skipped there anyway.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=${version}"
            # The heredoc form, not three `tags=` lines: GITHUB_OUTPUT keeps
            # one value per key, so repeating the key silently drops all but
            # the last and the image would only ever be tagged `:sha-<short>`.
            echo "tags<<HMX_TAGS_EOF"
            echo "${REGISTRY}/${IMAGE}:${version}"
            if [ "$GITHUB_REF_NAME" != "$GITHUB_REF_TYPE" ] || [ "$GITHUB_REF_TYPE" = branch ]; then
              echo "${REGISTRY}/${IMAGE}:latest"
            fi
            echo "${REGISTRY}/${IMAGE}:sha-${GITHUB_SHA::7}"
            echo "HMX_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        env:
          # Via env, not `${{ }}` inside the script: the value is multi-line,
          # and an expression spliced into a `run:` body is both harder to read
          # and a script-injection hazard.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag="$(printf '%s\n' "$TAGS" | head -1)"
          echo "testing $tag"
          # A silently empty tag made `docker run` fail with
          # "invalid reference format", which reads like a Docker problem and
          # is not one. Fail here instead, naming the cause.
          [ -n "$tag" ] || { echo "::error::no image tag derived; TAGS='$TAGS'"; exit 1; }
          # The exit code must survive the container boundary, or `hmx run` is
          # lying to anyone using the image in a script.
          mkdir -p /tmp/hmx-smoke
          printf 'fn main() -> int {\n    print("container ok")\n    return 7\n}\n' > /tmp/hmx-smoke/main.hmx
          # The image runs as an unprivileged user (uid 1000) and `hmx run`
          # writes build_temp.c into the working directory, so a bind mount
          # owned by the runner's uid is unwritable for it. Run the container
          # as the runner's uid — which is exactly what a real caller does, and
          # what makes `-v "$PWD:/src"` work on a normal machine where the
          # host uid is also 1000. GitHub's runner is 1001, which is how this
          # mismatch first showed up here.
          uid="$(id -u):$(id -g)"
          set +e
          out="$(docker run --rm --user "$uid" -v /tmp/hmx-smoke:/src "$tag" run main.hmx)"
          code=$?
          set -e
          echo "$out"; echo "exit=$code"
          [ "$out" = "container ok" ] || { echo "unexpected output"; exit 1; }
          [ "$code" = "7" ] || { echo "exit code did not propagate"; exit 1; }
          docker run --rm --user "$uid" "$tag" --version
          # The uid mismatch is the case that actually bites, so assert the
          # diagnostic and not just the failure: an unwritable working
          # directory has to be named as such, not reported as a missing
          # build_temp.c by the C compiler.
          chmod 0700 /tmp/hmx-smoke
          if docker run --rm --user 12345:12345 -v /tmp/hmx-smoke:/src "$tag" run main.hmx 2>&1 \
             | grep -q "cannot write build_temp.c"; then
            echo "unwritable working directory is reported clearly"
          else
            echo "::error::an unwritable working directory is not reported clearly"; exit 1
          fi

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
